name: Android Build
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint
        run: gradle lintDebug
      - name: Test
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NEXA-Browser-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Browser-debug
          path: NEXA-Browser-debug.apk
